name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history, not only the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: typos@1.50.2,taplo@0.10.0,shellcheck@0.11.0,shfmt@3.14.1,zizmor@1.30.1,cargo-machete@0.9.2,lychee@0.24.2,uv
      - name: Install Go, Node and Python linters
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # Exact version pin; see zizmor.yml for why this is not lockfile-managed.
          npm install --global --no-fund --no-audit markdownlint-cli2@0.23.3
          uv tool install ruff@0.16.8
      - name: Static analysis
        run: bash scripts/check.sh --strict static
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned toolchain
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # trybuild writes target/tests/<crate>/..., which rust-cache's target
          # cleanup cannot walk on Windows (ENOENT on target\tests\target).
          # Keep the registry cache everywhere; skip target caching there.
          cache-targets: ${{ runner.os != 'Windows' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny
      - run: cargo build --locked --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked --workspace
        env:
          INSTA_UPDATE: 'no'
      - name: Rule catalog documentation drift
        shell: bash
        run: |
          cargo run --locked -p nm-cli -- --data-dir "$RUNNER_TEMP/nm-rules" rules export-md > "$RUNNER_TEMP/RULES.md"
          diff -u docs/RULES.md "$RUNNER_TEMP/RULES.md"
        env:
          NETMASTER_NET: deny
      - run: cargo deny check
      - name: Direct connection boundary
        shell: bash
        run: bash scripts/check-no-direct-connect.sh
      - run: python scripts/check-dependency-boundaries.py
      - name: Forbidden command allowlist
        run: cargo test --locked -p nm-collect --test allowlist_test
      - name: Real TUI event loop, resize and restoration
        if: runner.os == 'Linux'
        run: python scripts/check-tui-pty.py
      - name: Deny-all egress factory
        run: cargo test --locked -p nm-app --test offline
        env:
          NETMASTER_NET: deny
