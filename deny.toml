[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
ignore = [{ id = "RUSTSEC-2023-0071", reason = "M1 uses RSA only for SSH signatures, never RSA decryption or PKCS#1 v1.5 depadding. See docs/adr/0005-ssh-transport.md; reassess before adding any RSA decryption." }]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
# This closed allowlist excludes GPL and AGPL licenses.

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  { name = "nm-creds", wrappers = [
    "nm-collect",
    "nm-app",
  ], reason = "Secrets belong only to collection and orchestration; AI cannot depend on credentials." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
